<g><rect x="102" y="252" width="265" height="38" rx="19" fill="none" stroke="#cba6f7" stroke-width="1.25"/><text x="234" y="271" fill="#cba6f7" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Post-quantum TLS (ML-KEM)</text></g><g><rect x="377" y="252" width="162" height="38" rx="19" fill="none" stroke="#cba6f7" stroke-width="1.25"/><text x="458" y="271" fill="#cba6f7" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Strict PQ mode</text></g><g><rect x="549" y="252" width="144" height="38" rx="19" fill="none" stroke="#89b4fa" stroke-width="1.25"/><text x="621" y="271" fill="#89b4fa" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">TLS 1.3 only</text></g><g><rect x="703" y="252" width="237" height="38" rx="19" fill="none" stroke="#89b4fa" stroke-width="1.25"/><text x="822" y="271" fill="#89b4fa" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Encrypted Client Hello</text></g><g><rect x="950" y="252" width="228" height="38" rx="19" fill="none" stroke="#94e2d5" stroke-width="1.25"/><text x="1064" y="271" fill="#94e2d5" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Strict site isolation</text></g><g><rect x="274" y="302" width="88" height="38" rx="19" fill="none" stroke="#fab387" stroke-width="1.25"/><text x="318" y="321" fill="#fab387" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">No JIT</text></g><g><rect x="372" y="302" width="162" height="38" rx="19" fill="none" stroke="#fab387" stroke-width="1.25"/><text x="453" y="321" fill="#fab387" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">No WebAssembly</text></g><g><rect x="544" y="302" width="116" height="38" rx="19" fill="none" stroke="#f38ba8" stroke-width="1.25"/><text x="602" y="321" fill="#f38ba8" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">No WebRTC</text></g><g><rect x="670" y="302" width="116" height="38" rx="19" fill="none" stroke="#f38ba8" stroke-width="1.25"/><text x="728" y="321" fill="#f38ba8" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">No WebGPU</text></g><g><rect x="796" y="302" width="209" height="38" rx="19" fill="none" stroke="#f9e2af" stroke-width="1.25"/><text x="900" y="321" fill="#f9e2af" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">CFI + Rust decoders</text></g><g><rect x="106" y="352" width="247" height="38" rx="19" fill="none" stroke="#a6e3a1" stroke-width="1.25"/><text x="230" y="371" fill="#a6e3a1" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Ad and tracker blocking</text></g><g><rect x="363" y="352" width="265" height="38" rx="19" fill="none" stroke="#a6e3a1" stroke-width="1.25"/><text x="496" y="371" fill="#a6e3a1" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Fingerprint randomisation</text></g><g><rect x="638" y="352" width="200" height="38" rx="19" fill="none" stroke="#89dceb" stroke-width="1.25"/><text x="738" y="371" fill="#89dceb" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">No Google services</text></g><g><rect x="848" y="352" width="162" height="38" rx="19" fill="none" stroke="#89dceb" stroke-width="1.25"/><text x="929" y="371" fill="#89dceb" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Zero telemetry</text></g><g><rect x="1020" y="352" width="153" height="38" rx="19" fill="none" stroke="#89b4fa" stroke-width="1.25"/><text x="1096" y="371" fill="#89b4fa" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Encrypted DNS</text></g><g><rect x="182" y="402" width="106" height="38" rx="19" fill="none" stroke="#f5c2e7" stroke-width="1.25"/><text x="235" y="421" fill="#f5c2e7" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">App lock</text></g><g><rect x="298" y="402" width="162" height="38" rx="19" fill="none" stroke="#f5c2e7" stroke-width="1.25"/><text x="379" y="421" fill="#f5c2e7" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Data shredding</text></g><g><rect x="470" y="402" width="190" height="38" rx="19" fill="none" stroke="#cba6f7" stroke-width="1.25"/><text x="565" y="421" fill="#cba6f7" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Per-site identity</text></g><g><rect x="670" y="402" width="209" height="38" rx="19" fill="none" stroke="#f9e2af" stroke-width="1.25"/><text x="774" y="421" fill="#f9e2af" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">PQC-signed releases</text></g><g><rect x="889" y="402" width="209" height="38" rx="19" fill="none" stroke="#94e2d5" stroke-width="1.25"/><text x="994" y="421" fill="#94e2d5" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="middle">Exploit mitigations</text></g>
