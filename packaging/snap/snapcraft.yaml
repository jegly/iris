# Iris snap — DRAFT v2 (2026-09-26). Modeled on Canonical's shipped chromium snapcraft.yaml (read from
# /snap/chromium/current/snap/snapcraft.yaml), curated down for Iris. Research + reasons: memory/04_SNAP.md (round 2).
# Built FROM the release .deb (chrome/installer/linux:stable_deb in out/Linux) so .deb and snap ship identical files.
# Build on the 26.04 host like AV (no LXD): copy the release .deb here as iris-browser-stable.deb, write its
# version to iris-version.txt, then `TMPDIR=~/.cache/iris-snap-tmp snapcraft pack --destructive-mode`
# (`snapcraft clean --destructive-mode` first when rebuilding). core26 = the host's 26.04 packages, so the staged
# libraries match the base. snapcraft 9.1's gnome extension is core22/24 only -> GTK etc. are staged here instead.
# NEEDS a Snap Store request before publishing: browser-support allow-sandbox:true, setuid chrome-sandbox,
# auto-connect password-manager-service. camera/audio-record: included but NOT requested for auto-connect.
name: iris-browser            # "iris" is taken in the Snap Store (jegly 2026-09-30); app = iris-browser -> command `iris-browser`
title: Iris
summary: Hardened browser built on Chromium, for security and privacy
description: |
  Iris started with a look at the most hardened, privacy-focused browsers around. We took what worked,
  improved on it, and added what they were missing. It's a hardened browser for the modern age, and an
  open-source alternative if privacy & security matter to you.
adopt-info: iris
grade: stable
confinement: strict
base: core26
compression: lzo              # faster first launch than xz (Canonical's choice)
license: GPL-2.0-or-later     # Iris patches (jegly); Chromium components keep their own licenses
# Store page links (2026-10-10). Contact goes to the issue tracker, not a personal address.
website: https://github.com/jegly/iris
source-code: https://github.com/jegly/iris
issues: https://github.com/jegly/iris/issues
contact: https://github.com/jegly/iris/issues

apps:
  iris-browser:
    extensions: [gpu]         # mesa-2604 via the gpu-2604 content snap + its command-chain wrapper
    command: bin/iris.launcher
    desktop: usr/share/applications/iris-browser.desktop   # from the .deb (StartupWMClass=iris-browser)
                              # VERIFY at first build: snapcraft rewrites Exec=/usr/bin/iris-browser-stable -> the app,
                              # and Icon= resolves inside the snap
    common-id: io.jegly.iris
    environment:
      CHROME_DESKTOP: iris-browser.desktop   # matches apply-deb-rebrand.sh + StartupWMClass
      CHROME_CONFIG_HOME: $SNAP_USER_COMMON  # profile at $SNAP_USER_COMMON/iris, kept across revisions
      GTK_USE_PORTAL: "1"                    # Save/Open dialogs through xdg-desktop-portal
      GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
      XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb   # keyboard layouts (GTK on Wayland aborts without them)
      GTK_PATH: $SNAP/usr/lib/x86_64-linux-gnu/gtk-3.0
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
    plugs:
      - browser-sandbox
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - gsettings
      - gtk-3-themes
      - icon-themes
      - sound-themes
      - audio-playback
      - home
      - network
      - network-bind
      - password-manager-service   # optional: keyring over D-Bus. Without it the Secret portal is used (no connection needed)
      - removable-media
      - screen-inhibit-control
      - system-packages-doc
      - timezone-control
      - u2f-devices                # YubiKey / FIDO2 (hidraw NOT needed — verified on jegly's box)
      - unity7                     # xdg-open
      - upower-observe
      - camera                     # jegly 2026-09-26: included, NOT auto-connected (user runs snap connect);
      - audio-record               # sites still need a per-site allow (Iris default BLOCK)
    slots:
      - mpris

slots:
  mpris:
    interface: mpris
    name: iris-browser        # Iris registers org.mpris.MediaPlayer2.iris-browser.instance<pid> (apply-mpris-name.sh); store reviewer asked for the snap's own name (2026-10-09)

plugs:
  # Shared GTK themes / icons / cursors, like Chromium's snap (gtk-common-themes is base-independent data)
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true        # real Chromium sandbox (store review)

# NOT included vs Canonical, on purpose: bluez, raw-usb, serial-port, hidraw, joystick (web APIs removed),
# cups + install-cups-runtime-dependency (printing off), pcscd + opensc (no smartcards), kerberos-tickets,
# network-manager, mount-observe, hardware-observe, system-files (no policy dir), personal-files (no
# ~/.config/chromium import), chromedriver app, kiosk "daemon" app (ran --no-sandbox), firstrun page, va-drivers
# (use_vaapi=false), swiftshader (compiled out).

parts:
  iris:
    plugin: dump
    source: iris-browser-stable.deb        # copy the release .deb here (out/Linux/iris-browser-stable_*.deb)
                                           # and write its version to iris-version.txt
    source-type: deb
    organize:
      opt/jegly/iris: usr/lib/iris
    stage-packages:              # 26.04 names; from ldd of the Iris binary + what Chromium loads at runtime
      - libasound2t64
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libcairo2
      - libdbus-1-3
      - libdrm2
      - libgbm1
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libgtk-3-common            # GSettings schemas GTK needs
      - libnspr4
      - libnss3
      - libpango-1.0-0
      - libpci3
      - libpulse0
      - libsecret-1-0
      - libvulkan1
      - libxcomposite1
      - libxdamage1
      - libxkbcommon0
      - libxrandr2
      - libxss1
      - fontconfig-config
      - xkb-data
      - ca-certificates
    override-build: |
      craftctl default
      # The .deb's /usr/bin symlink points into /opt; the snap runs bin/iris.launcher instead.
      rm -f "$CRAFT_PART_INSTALL/usr/bin/iris-browser-stable"
      # setuid sandbox helper -> Chromium's sandbox works even where unprivileged user namespaces are off.
      # (organize to usr/lib/iris happens after this step, so the .deb path is still opt/jegly/iris here)
      chmod 4555 "$CRAFT_PART_INSTALL/opt/jegly/iris/chrome-sandbox"
      # version: written next to the .deb when it is copied in (e.g. 156.0.8073.0)
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/iris-version.txt")"
    prime:
      - -etc/cron.daily            # .deb repo cron job (no apt repo in a snap)
      - -etc/apparmor.d            # snapd generates the confinement profile
      - -usr/lib/iris/apparmor.d
      - -usr/lib/iris/cron
      - -usr/share/man
      - -usr/share/lintian
      - -usr/share/menu

    override-prime: |
      craftctl default
      # The .deb's postinst installs the themed "iris-browser" icon; snaps run no postinst -> point at the file.
      sed -i 's|^Icon=iris-browser$|Icon=${SNAP}/usr/lib/iris/product_logo_256.png|' \
        "$CRAFT_PRIME/usr/share/applications/iris-browser.desktop"
      glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"

  launcher:
    plugin: dump
    source: launcher
    organize:
      '*': bin/
